<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ — Bing Search v3.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0b0f14;
      --bg-card: #1a1f26;
      --bg-card-hover: #212832;
      --border: #2a323d;
      --border-active: #0ea5b7;
      --text-main: #f3f6fa;
      --text-muted: #9aa5b1;
      --accent: #06b6d4;
      --accent-soft: rgba(6, 182, 212, 0.14);
      --blurple: #5865f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 80% 10%, rgba(6, 182, 212, 0.12), transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(88, 101, 242, 0.08), transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c6ff, #2563eb);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(0, 198, 255, 0.35);
    }

    .app-badge {
      background: var(--blurple);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-main);
    }

    .nav-links a.active {
      color: var(--accent);
      font-weight: 600;
    }

    .version-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(6, 182, 212, 0.45);
      padding: 0.12rem 0.45rem;
      border-radius: 6px;
    }

    .lang-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.42rem 0.7rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .lang-select:hover,
    .lang-select:focus {
      border-color: var(--accent);
    }

    /* Main Container */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 3.2rem 1.25rem 4.5rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.02rem;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Search Bar */
    .search-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem 0.9rem 2.85rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.16);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Category Pills */
    .tabs {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.48rem 1rem;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: #3d4857;
    }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Accordion List */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .faq-item.open {
      border-color: var(--border-active);
    }

    .faq-trigger {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 1.15rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      text-align: left;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .faq-trigger:hover {
      background: var(--bg-card-hover);
    }

    .faq-chevron {
      flex-shrink: 0;
      color: var(--accent);
      transition: transform 0.25s ease;
    }

    .faq-item.open .faq-chevron {
      transform: rotate(180deg);
    }

    .faq-body {
      display: none;
      padding: 0 1.3rem 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #c2cbd6;
      font-size: 0.94rem;
    }

    .faq-item.open .faq-body {
      display: block;
      padding-top: 1rem;
    }

    .faq-body code {
      background: rgba(255, 255, 255, 0.07);
      color: #7dd3fc;
      padding: 0.12rem 0.38rem;
      border-radius: 5px;
      font-size: 0.88em;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 14px;
      display: none;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.86rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

          it: "No. È un progetto indipendente per Discord senza affiliazione o sponsorizzazione ufficiale da parte di Microsoft, Bing, Brave, YouTube o Discord Inc."
        }
      },
      {
        cat: "support",
        q: {
          pt: "Quais permissões o bot precisa no servidor?",
          en: "What permissions does the bot need in the server?",
          es: "¿Qué permisos necesita el bot en el servidor?",
          fr: "De quelles permissions le bot a-t-il besoin sur le serveur ?",
          de: "Welche Berechtigungen benötigt der Bot auf dem Server?",
          it: "Di quali permessi ha bisogno il bot nel server?"
        },
        a: {
          pt: "Apenas as permissões essenciais para responder comandos slash (como enviar mensagens e embeds/links). Ele não exige permissão de administrador nem lê mensagens comuns do chat.",
          en: "Only the essential permissions needed to reply to slash commands (such as sending messages and embeds/links). It does not require administrator access and does not read regular chat messages.",
          es: "Solo los permisos esenciales para responder comandos slash (como enviar mensajes y embeds/enlaces). No pide permisos de administrador ni lee mensajes normales del chat.",
          fr: "Uniquement les autorisations essentielles pour répondre aux commandes slash (envoi de messages et embeds/liens). Il ne demande pas les droits d'administrateur et ne lit pas les messages ordinaires.",
          de: "Nur die notwendigen Berechtigungen für Slash-Befehle (Nachrichten und Embeds/Links senden). Es sind keine Admin-Rechte nötig und normale Chatnachrichten werden nicht gelesen.",
          it: "Solo i permessi essenziali per rispondere ai comandi slash (invio di messaggi e embed/link). Non richiede privilegi di amministratore né legge i messaggi normali della chat."
        }
      }
    ];

    const langSelect = document.getElementById("langSelect");
    const searchInput = document.getElementById("faqSearch");
    const categoryTabs = document.getElementById("categoryTabs");
    const faqList = document.getElementById("faqList");
    const emptyState = document.getElementById("emptyState");

    let currentLang = detectLanguage();
    let currentCat = "all";

    function detectLanguage() {
      const saved = localStorage.getItem("bingsearch_lang");
      if (saved && UI[saved]) return saved;
      const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
      return UI[browser] ? browser : "en";
    }

    function applyTranslations() {
      const t = UI[currentLang];
      document.documentElement.lang = t.htmlLang;
      langSelect.value = currentLang;
      searchInput.placeholder = t.searchPlaceholder;
      emptyState.textContent = t.empty;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });

      renderTabs();
      renderFaqs();
    }

    function renderTabs() {
      const cats = UI[currentLang].cats;
      categoryTabs.innerHTML = Object.entries(cats).map(([key, label]) => `
        <button class="tab-btn ${currentCat === key ? "active" : ""}" data-cat="${key}">${label}</button>
      `).join("");

      categoryTabs.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCat = btn.dataset.cat;
          renderTabs();
          renderFaqs();
        });
      });
    }

    function renderFaqs() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = FAQS.filter(item => {
        const matchCat = currentCat === "all" || item.cat === currentCat;
        const text = (item.q[currentLang] + " " + item.a[currentLang]).toLowerCase();
        return matchCat && (!term || text.includes(term));
      });

      if (!filtered.length) {
        faqList.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      faqList.innerHTML = filtered.map((item, idx) => `
        <article class="faq-item ${idx === 0 && !term ? "open" : ""}">
          <button class="faq-trigger" aria-expanded="${idx === 0 && !term ? "true" : "false"}">
            <span>${item.q[currentLang]}</span>
            <svg class="faq-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="faq-body">${item.a[currentLang]}</div>
        </article>
      `).join("");

      faqList.querySelectorAll(".faq-trigger").forEach(btn => {
        btn.addEventListener("click", () => {
          const parent = btn.closest(".faq-item");
          const isOpen = parent.classList.toggle("open");
          btn.setAttribute("aria-expanded", String(isOpen));
        });
      });
    }

    langSelect.addEventListener("change", () => {
      currentLang = langSelect.value;
      localStorage.setItem("bingsearch_lang", currentLang);
      applyTranslations();
    });

    searchInput.addEventListener("input", renderFaqs);

    applyTranslations();
  </script>
</body>
</html>
