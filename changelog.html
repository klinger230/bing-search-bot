<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changelog — Bing Search v3.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0b0f14;
      --bg-card: #1a1f26;
      --bg-card-latest: linear-gradient(180deg, #1d242e 0%, #151a21 100%);
      --border: #2a323d;
      --text-main: #f3f6fa;
      --text-muted: #9aa5b1;
      --accent: #06b6d4;
      --accent-soft: rgba(6, 182, 212, 0.14);
      --blurple: #5865f2;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 80% 10%, rgba(6, 182, 212, 0.12), transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(88, 101, 242, 0.09), transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c6ff, #2563eb);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(0, 198, 255, 0.35);
    }

    .app-badge {
      background: var(--blurple);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.35rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--text-main); }

    .nav-links a.active { color: var(--accent); font-weight: 600; }

    .version-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(6, 182, 212, 0.45);
      padding: 0.12rem 0.45rem;
      border-radius: 6px;
    }

    .lang-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.42rem 0.7rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .lang-select:hover,
    .lang-select:focus { border-color: var(--accent); }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4.5rem;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.65rem);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: #4ade80;
      background: var(--green-soft);
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }

    @keyframes slowPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: slowPulse 3.6s ease-in-out infinite;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 620px;
    }

    .replay-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .replay-btn:hover {
      border-color: var(--accent);
      background: #212832;
    }

    /* Timeline */
    .timeline-wrap {
      position: relative;
      padding-left: 2.35rem;
    }

    .timeline-track {
      position: absolute;
      left: 9px;
      top: 1.5rem;
      width: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .timeline-fill {
      position: absolute;
      inset: 0 0 auto 0;
      height: 0;
      background: linear-gradient(180deg, var(--blurple), var(--accent), var(--green));
      transition: height 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .release-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      opacity: 0;
      transform: translateY(-16px);
      transition: opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1), transform 1.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.5s ease;
    }

    .release-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .release-card.latest {
      background: var(--bg-card-latest);
      border-color: rgba(34, 197, 94, 0.45);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .release-dot {
      position: absolute;
      left: -2.35rem;
      top: 1.55rem;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
    }

    .release-dot span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      box-shadow: 0 0 0 4px var(--bg-base);
      transition: all 0.7s ease;
    }

    .release-dot.active span {
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--bg-base), 0 0 14px var(--accent);
    }

    .release-dot.latest span {
      width: 16px;
      height: 16px;
      background: var(--green);
      box-shadow: 0 0 0 4px var(--bg-base), 0 0 16px rgba(34, 197, 94, 0.6);
      animation: slowPulse 3.6s ease-in-out infinite;
    }

    .release-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .version-tag {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
    }

    .release-card.latest .version-tag {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .release-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .release-title {
      font-size: 1.18rem;
      font-weight: 800;
      margin-bottom: 0.95rem;
      color: var(--text-main);
    }

    .release-card.latest .release-title {
      color: #86efac;
    }

    .change-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .change-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      font-size: 0.93rem;
      color: #cbd5e1;
    }

    .change-item code {
      background: rgba(0, 0, 0, 0.4);
      color: #38bdf8;
      padding: 0.1rem 0.38rem;
      border-radius: 5px;
      font-size: 0.86em;
    }

    .badge {
      flex-shrink: 0;
      margin-top: 0.18rem;
      font-size: 0.66rem;
      font-weight: 800;
      padding: 0.14rem 0.45rem;
      border-radius: 5px;
      letter-spacing: 0.03em;
      border: 1px solid transparent;
    }

    .badge-emerald { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); }
    .badge-indigo  { background: rgba(99, 102, 241, 0.2);  color: #a5b4fc; border-color: rgba(99, 102, 241, 0.35); }
    .badge-amber   { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border-color: rgba(245, 158, 11, 0.35); }
    .badge-purple  { background: rgba(168, 85, 247, 0.2);  color: #d8b4fe; border-color: rgba(168, 85, 247, 0.35); }
    .badge-rose    { background: rgba(244, 63, 94, 0.18);  color: #fda4af; border-color: rgba(244, 63, 94, 0.35); }

    .footer {
      text-align: center;
      padding: 2rem 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.86rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover { text-decoration: underline; }
  </style>
</head>

      const langSelect = document.getElementById("langSelect");
      const timelineList = document.getElementById("timelineList");
      const timelineTrack = document.getElementById("timelineTrack");
      const timelineFill = document.getElementById("timelineFill");
      const replayBtn = document.getElementById("replayBtn");

      let timers = [];
      let currentLang = detectLanguage();

      function detectLanguage() {
        try {
          const saved = localStorage.getItem("bingsearch_lang");
          if (saved && UI[saved]) return saved;
        } catch (e) {}
        const browser = (navigator.language || "pt").slice(0, 2).toLowerCase();
        return UI[browser] ? browser : "pt";
      }

      function clearTimers() {
        timers.forEach((id) => clearTimeout(id));
        timers = [];
      }

      function syncTrackHeight() {
        const cards = timelineList ? timelineList.querySelectorAll(".release-card") : [];
        if (!timelineTrack || cards.length < 2) return;
        const firstTop = cards[0].offsetTop + 28;
        const lastTop = cards[cards.length - 1].offsetTop + 28;
        timelineTrack.style.top = `${firstTop}px`;
        timelineTrack.style.height = `${Math.max(0, lastTop - firstTop)}px`;
      }

      function renderTimeline(animate) {
        clearTimers();
        if (!timelineList) return;

        const releases = UI[currentLang].releases;
        timelineList.innerHTML = releases.map((rel, idx) => {
          const itemsHtml = rel.changes.map((ch) => `
            <li class="change-item">
              <span class="badge badge-${ch.color}">${ch.tag}</span>
              <span>${ch.text}</span>
            </li>
          `).join("");

          return `
            <article class="release-card ${rel.isLatest ? "latest" : ""}" id="rel-card-${idx}">
              <div class="release-dot ${rel.isLatest ? "latest" : ""}" id="rel-dot-${idx}">
                <span></span>
              </div>
              <div class="release-meta">
                <span class="version-tag">${rel.version} — ${rel.statusLabel}</span>
                <span class="release-date">${rel.date}</span>
              </div>
              <h2 class="release-title">${rel.title}</h2>
              <ul class="change-list">${itemsHtml}</ul>
            </article>
          `;
        }).join("");

        requestAnimationFrame(() => {
          syncTrackHeight();

          if (!animate) {
            timelineList.querySelectorAll(".release-card").forEach((c) => c.classList.add("visible"));
            timelineList.querySelectorAll(".release-dot").forEach((d, i) => {
              d.classList.toggle("active", !releases[i].isLatest);
            });
            if (timelineFill) timelineFill.style.height = "100%";
            return;
          }

          if (timelineFill) timelineFill.style.height = "0px";

          releases.forEach((_, idx) => {
            const delay = 350 + idx * 1050;
            const id = setTimeout(() => {
              const card = document.getElementById(`rel-card-${idx}`);
              const dot = document.getElementById(`rel-dot-${idx}`);
              if (card) card.classList.add("visible");
              if (dot && !releases[idx].isLatest) dot.classList.add("active");

              if (timelineFill && idx > 0) {
                const pct = Math.round((idx / (releases.length - 1)) * 100);
                timelineFill.style.height = `${pct}%`;
              }
            }, delay);
            timers.push(id);
          });
        });
      }

      function applyLanguage(animate) {
        const t = UI[currentLang];
        document.documentElement.lang = t.htmlLang;
        if (langSelect) langSelect.value = currentLang;

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) el.textContent = t[key];
        });

        renderTimeline(animate);
      }

      if (langSelect) {
        langSelect.addEventListener("change", () => {
          currentLang = langSelect.value;
          try {
            localStorage.setItem("bingsearch_lang", currentLang);
          } catch (e) {}
          applyLanguage(false);
        });
      }

      if (replayBtn) {
        replayBtn.addEventListener("click", () => renderTimeline(true));
      }

      window.addEventListener("resize", syncTrackHeight);

      applyLanguage(true);
    })();
  </script>
